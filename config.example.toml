# Copy to config.toml. Model identifiers live here, never in source code (OPS-02).

[models]
narrator = ""        # a current model identifier; D-032 chose the cheapest Claude model for the first test
summarizer = ""      # may be a smaller model; evaluate before switching
base_url = ""        # empty = the Anthropic API; "http://localhost:11434" = a local Ollama server (D-020)
                     # Ollama: start the server with OLLAMA_CONTEXT_LENGTH=32768 (D-027)
                     # start.bat runs a private one on port 11435, so use "http://127.0.0.1:11435" with it
think = true         # false asks the model to skip its thinking step (faster, may lower quality)

[budget]
max_input_tokens_per_turn = 20000
max_session_spend_usd = 5.00
recent_turns_verbatim = 6
scenes_per_chapter = 10
max_tool_rounds = 6
max_tool_retries = 2

[pricing]
# USD per million tokens, per model identifier set above; used for max_session_spend_usd.
# Example: "<model id>" = { input = 0.0, cached_input = 0.0, output = 0.0 }

[gameplay]
permadeath = false
violence = "moderate"     # low | moderate | graphic
seed = 0                  # 0 = random per new timeline
opening_gods = []         # empty = drawn from the seed; e.g. ["veshra", "drovash"] to fix them for tests

[paths]
world_dir = "world"
data_dir = "data"
