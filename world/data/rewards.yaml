# Balance values (G-08). D-030's first guesses, then M1e's XP and loot (D-046). The owner's playtests tune them.
xp: {minor: 69, major: 161, milestone: 403}
xp_per_turn_cap: 460
level_gains: {primary: 2, secondary: 1, free_points: 1}
standing: {slight: 2, notable: 5, grave: 15}
damage_percent: {failure: 25, success_at_cost: 10, hazard: 15}
heal_percent: {aid: 25}
petition: {granted: 5, ignored: 2, days: 7}
# M1e, approved by the owner (D-046): XP scales with tier so each tier takes about tier_time_growth times
# the last (D-014); foes give XP when brought down; loot tables pay coin, items and shard fragments.
tier_time_growth: 1.5
foe_xp: {minion: 127, standard: 311, elite: 748}
foe_xp_above_percent: 50
foe_xp_below_percent: 25
coin_gain_cp_per_turn: 360
items_per_turn: 3
loot:
  foe:minion:
    rolls: 1
    entries:
      - {weight: 60, coin_cp: [2, 12]}
      - {weight: 25, item: healing_tonic}
      - {weight: 15, fragment: true}
  foe:standard:
    rolls: 1
    entries:
      - {weight: 45, coin_cp: [12, 48]}
      - {weight: 25, item: healing_tonic}
      - {weight: 8, item: dagger}
      - {weight: 22, fragment: true}
  foe:elite:
    rolls: 2
    entries:
      - {weight: 45, coin_cp: [36, 180]}
      - {weight: 20, item: healing_tonic}
      - {weight: 8, item: sword}
      - {weight: 4, item: chain_shirt}
      - {weight: 23, fragment: true}
  cache:
    rolls: 1
    entries:
      - {weight: 50, coin_cp: [12, 120]}
      - {weight: 25, item: healing_tonic}
      - {weight: 10, item: rope}
      - {weight: 15, fragment: true}
  bounty:
    rolls: 1
    entries:
      - {weight: 1, coin_cp: [60, 360]}  # A Tier 1 bounty pays 5 to 30 sp (world/economy.md).
