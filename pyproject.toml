[project]
name = "pantheon"
version = "0.1.0"
description = "A single-player LitRPG narrated by an LLM over a deterministic engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.scripts]
pantheon = "pantheon.ui.cli.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantheon"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".claude", "scripts/render_plan.py", "docs", "world", "prompts", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pantheon/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/pantheon"]
branch = true
