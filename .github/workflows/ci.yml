# Adapted from the AI-Master-Instructions template with the efficient-github-actions skill.
# Tier 1 (every PR and main push): drift check, ruff, mypy on the engine, pytest with coverage. One Linux job.
# Tier 3 (manual "Run workflow" only): the same tests on Windows, where the game runs (D-021).
name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      # The runner image ships Node 20+, which sync.mjs needs; no setup-node step.
      - run: node .claude/master/sync.mjs --check
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=90

  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked
      - run: uv run pytest
